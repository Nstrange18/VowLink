<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  
  <!-- Outer golden frame -->
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#D8B76A" stroke-width="1.5" opacity="0.3" />
  
  <!-- Inner delicate frame -->
  <rect x="30" y="30" width="740" height="540" rx="12" fill="none" stroke="#D8B76A" stroke-width="0.75" opacity="0.15" />

  <!-- Camera/Photo Icon placeholder -->
  <g transform="translate(400, 240)" opacity="0.4">
    <!-- Camera body -->
    <path d="M-40,-10 L-25,-10 L-20,-20 L20,-20 L25,-10 L40,-10 C45,-10 49,-6 49,-1 L49,30 C49,35 45,39 40,39 L-40,39 C-45,39 -49,35 -49,30 L-49,-1 C-49,-6 -45,-10 -40,-10 Z" fill="none" stroke="#D8B76A" stroke-width="2" />
    <!-- Lens -->
    <circle cx="0" cy="15" r="16" fill="none" stroke="#D8B76A" stroke-width="2" />
    <circle cx="0" cy="15" r="8" fill="none" stroke="#D8B76A" stroke-width="1.5" />
    <!-- Flash/Button -->
    <circle cx="32" cy="-2" r="3" fill="#D8B76A" />
  </g>

  <!-- Elegant text -->
  <text x="50%" y="360" font-family="'Inter', 'Playfair Display', 'Georgia', serif" font-size="26" font-weight="600" fill="#D8B76A" letter-spacing="2" text-anchor="middle" opacity="0.8">VOWLINK DIRECTORIES</text>
  <text x="50%" y="405" font-family="'Inter', 'Outfit', sans-serif" font-size="18" fill="#FFFFFF" letter-spacing="1" text-anchor="middle" opacity="0.5">No photo uploaded by partner yet</text>
</svg>
