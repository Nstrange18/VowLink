<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-label="VowLink story poster for wedding invites">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070A13"/>
      <stop offset="0.6" stop-color="#0D1220"/>
      <stop offset="1" stop-color="#1A2E4A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D8B76A"/>
      <stop offset="1" stop-color="#F8E6A8"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <circle cx="930" cy="210" r="230" fill="#D8B76A" opacity="0.12"/>
  <circle cx="110" cy="1660" r="360" fill="#7FA6D9" opacity="0.1"/>

  <g transform="translate(82 86)">
    <image href="../vowlink-icon.svg" x="0" y="0" width="56" height="56"/>
    <text x="74" y="40" fill="#F8F0DA" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700">VowLink</text>
  </g>

  <g transform="translate(82 245)">
    <text x="0" y="0" fill="#FFFFFF" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="700">Stop sending</text>
    <text x="0" y="112" fill="#FFFFFF" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="700">plain wedding</text>
    <text x="0" y="224" fill="url(#gold)" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="700">invites.</text>
    <text x="0" y="315" fill="#C9D4EA" font-family="Arial, sans-serif" font-size="34">Send each guest a beautiful link with RSVP,</text>
    <text x="0" y="365" fill="#C9D4EA" font-family="Arial, sans-serif" font-size="34">WhatsApp sharing, seating and QR check-in.</text>
  </g>

  <g transform="translate(234 720)" filter="url(#softShadow)">
    <rect x="0" y="0" width="612" height="730" rx="44" fill="#F8F0E3" stroke="#D8B76A" stroke-width="3"/>
    <circle cx="96" cy="88" r="54" fill="#D8B76A" opacity="0.18"/>
    <circle cx="520" cy="620" r="82" fill="#7FA6D9" opacity="0.16"/>
    <text x="306" y="130" text-anchor="middle" fill="#1A2E4A" font-family="Georgia, 'Times New Roman', serif" font-size="42">Wedding Invitation</text>
    <text x="306" y="226" text-anchor="middle" fill="#0D1220" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700">Chioma &amp; Kene</text>
    <text x="306" y="300" text-anchor="middle" fill="#64748B" font-family="Arial, sans-serif" font-size="24">You are cordially invited</text>
    <line x1="176" y1="350" x2="436" y2="350" stroke="#D8B76A" stroke-width="3"/>
    <text x="306" y="414" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="25">Saturday, 15 August 2026</text>
    <text x="306" y="455" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="25">11:00 AM</text>
    <g transform="translate(146 525)">
      <rect width="320" height="74" rx="37" fill="#0D1220"/>
      <text x="160" y="47" text-anchor="middle" fill="#F2D894" font-family="Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="2">RSVP ONLINE</text>
    </g>
  </g>

  <g transform="translate(82 1546)">
    <rect x="0" y="0" width="916" height="112" rx="56" fill="url(#gold)"/>
    <text x="458" y="70" text-anchor="middle" fill="#070A13" font-family="Arial, sans-serif" font-size="31" font-weight="900" letter-spacing="2">CREATE YOUR VOWLINK TODAY</text>
  </g>

  <g transform="translate(82 1710)">
    <text x="0" y="0" fill="#D8B76A" font-family="Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="5">WHAT YOU GET</text>
    <text x="0" y="58" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="30">Digital invitation pages</text>
    <text x="0" y="108" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="30">RSVP tracking and guest lists</text>
    <text x="0" y="158" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="30">QR code check-in for your event</text>
  </g>
</svg>
