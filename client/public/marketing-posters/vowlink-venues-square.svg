<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-label="VowLink venue partner publicity poster">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8E8"/>
      <stop offset="0.55" stop-color="#F7EFDF"/>
      <stop offset="1" stop-color="#E8D7B6"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A13"/>
      <stop offset="1" stop-color="#1A2E4A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C49A3A"/>
      <stop offset="1" stop-color="#F2D894"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#1A2E4A" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="935" cy="120" r="240" fill="#D8B76A" opacity="0.18"/>
  <circle cx="105" cy="950" r="260" fill="#1A2E4A" opacity="0.08"/>

  <g transform="translate(82 78)">
    <image href="../vowlink-icon.webp" x="0" y="0" width="52" height="52"/>
    <text x="68" y="38" fill="#1A2E4A" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">VowLink</text>
    <text x="68" y="68" fill="#A97710" font-family="Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="5">VENUE PARTNERS</text>
  </g>

  <g transform="translate(82 196)">
    <text x="0" y="0" fill="#070A13" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700">Get discovered</text>
    <text x="0" y="88" fill="#070A13" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700">by wedding</text>
    <text x="0" y="176" fill="#A97710" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700">couples.</text>
    <text x="0" y="248" fill="#475569" font-family="Arial, sans-serif" font-size="28">List your venue, show your photos, receive inquiries,</text>
    <text x="0" y="288" fill="#475569" font-family="Arial, sans-serif" font-size="28">and build trust with verified venue details.</text>
  </g>

  <g transform="translate(572 250)" filter="url(#shadow)">
    <rect width="380" height="520" rx="38" fill="url(#dark)"/>
    <rect x="34" y="42" width="312" height="180" rx="28" fill="#D8B76A" opacity="0.22"/>
    <text x="58" y="284" fill="#FFFFFF" font-family="Georgia, 'Times New Roman', serif" font-size="34">Monarchy Hotels</text>
    <text x="58" y="326" fill="#D8B76A" font-family="Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="4">VERIFIED VENUE</text>
    <line x1="58" y1="360" x2="322" y2="360" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="58" y="404" fill="#C9D4EA" font-family="Arial, sans-serif" font-size="20">Capacity: 200-400 guests</text>
    <text x="58" y="444" fill="#C9D4EA" font-family="Arial, sans-serif" font-size="20">Photos, address and WhatsApp</text>
    <text x="58" y="484" fill="#C9D4EA" font-family="Arial, sans-serif" font-size="20">Visible to ready couples</text>
  </g>

  <g transform="translate(82 616)">
    <rect x="0" y="0" width="420" height="76" rx="38" fill="url(#dark)"/>
    <text x="210" y="49" text-anchor="middle" fill="#F2D894" font-family="Arial, sans-serif" font-size="24" font-weight="900" letter-spacing="2">JOIN VOWLINK VENUES</text>
  </g>

  <g transform="translate(82 762)">
    <rect x="0" y="0" width="276" height="94" rx="26" fill="#FFFFFF" opacity="0.75" stroke="#D8B76A" stroke-opacity="0.6"/>
    <rect x="306" y="0" width="276" height="94" rx="26" fill="#FFFFFF" opacity="0.75" stroke="#D8B76A" stroke-opacity="0.6"/>
    <rect x="612" y="0" width="276" height="94" rx="26" fill="#FFFFFF" opacity="0.75" stroke="#D8B76A" stroke-opacity="0.6"/>
    <text x="138" y="38" text-anchor="middle" fill="#A97710" font-family="Arial, sans-serif" font-size="14" font-weight="900">PROFILE</text>
    <text x="138" y="66" text-anchor="middle" fill="#0D1220" font-family="Arial, sans-serif" font-size="21" font-weight="700">Showcase details</text>
    <text x="444" y="38" text-anchor="middle" fill="#A97710" font-family="Arial, sans-serif" font-size="14" font-weight="900">INQUIRIES</text>
    <text x="444" y="66" text-anchor="middle" fill="#0D1220" font-family="Arial, sans-serif" font-size="21" font-weight="700">Receive leads</text>
    <text x="750" y="38" text-anchor="middle" fill="#A97710" font-family="Arial, sans-serif" font-size="14" font-weight="900">TRUST</text>
    <text x="750" y="66" text-anchor="middle" fill="#0D1220" font-family="Arial, sans-serif" font-size="21" font-weight="700">Get verified</text>
  </g>

  <text x="82" y="980" fill="#475569" font-family="Arial, sans-serif" font-size="24">For hotels, halls, gardens and event spaces ready for weddings.</text>
</svg>
